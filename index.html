<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <video autoplay muted loop id="bg-video">
        <source src="/img/logos_backgroun/background.mp4" type="video/mp4">
    </video>

    
    <div class="container">

        <div class="titulo">
            <img src="img/logos_backgroun/logo.png" alt="">
        </div>

        <h2 id="titulo-dinamico">Elija una carta</h2>

        <div class="deck">
            <div class="card c1" style="z-index: 1;" data-nombre="Comodines">
                <img src="img/jokers/Throwback.webp" alt="">
            </div>

            <div class="card c2" style="z-index: 2;" data-nombre="Planetas">
                <img src="img/card_planet/Planet_Mercury.webp" alt="">
            </div>

            <div class="card c3" style="z-index: 3;" data-nombre="Principal">
                <img src="img/jokers/Joker.webp" alt="">
            </div>

            <div class="card c4" style="z-index: 2;" data-nombre="Tarot">
                <img src="img/tarot/Tarot_The_Lovers.webp" alt="">
            </div>

            <div class="card c5" style="z-index: 1;" data-nombre="Espectrales">
                <img src="img/spectral/Spectral_Cryptid.webp" alt="">
            </div>
        </div>

    </div>


    
    
    <script src="script.js"></script>
</body>
</html>
